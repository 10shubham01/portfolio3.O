# When a file under 'database/' is changed:
database/migrations/**:
  - "[ ] Migration script tested on staging"
  - "[ ] Index added for the query columns"
  - "[ ] Nullable and Not Nullable columns conditions checked properly"
  - "[ ] Rollback script verified"
  - "[ ] Migration reviewed"
 
# When a file under 'app/Models/' is changed:
app/Models/**:
  - "[ ] Model changes reviewed"
  - "[ ] Migration, Create and Update validator created"
  - "[ ] Unit test completed"
  - "[ ] Data integrity verified"
 
# When a file under 'app/Repositories/' is changed:
app/Repositories/**:
  - "[ ] Repository logic reviewed"
  - "[ ] Query performance checked"
  - "[ ] Unit test completed"
 
# When a file under 'app/Services/' is changed:
app/Services/**:
  - "[ ] Service logic reviewed"
  - "[ ] Error handling verified"
  - "[ ] Unit test completed"
 
# When a file under 'app/Validators/' is changed:
app/Validators/**:
  - "[ ] Validation rules reviewed"
  - "[ ] Edge cases tested"
  - "[ ] Unit test completed"
 
# When a file under 'app/Queues/' is changed:
app/Queues/**:
  - "[ ] Queue logic reviewed"
  - "[ ] Failure/retry handling verified"
  - "[ ] Monitoring/alerting updated if needed"
 
# When a file under 'app/Libraries/' is changed:
app/Libraries/**:
  - "[ ] Library logic reviewed"
  - "[ ] Integration points tested"
  - "[ ] Documentation updated"
 
# When a file under 'app/Controllers/' is changed:
app/Controllers/**:
  - "[ ] Controller logic reviewed"
  - "[ ] Request/response schema validated"
  - "[ ] Error handling verified"
  - "[ ] Unit test completed"
 
# When a file under 'app/Middleware/' is changed:
app/Middleware/**:
  - "[ ] Middleware logic reviewed"
  - "[ ] Security and validation checks verified"
  - "[ ] Unit test completed"
 
# When a file under 'commands/' is changed:
commands/**:
  - "[ ] Command logic reviewed"
  - "[ ] Input validation checked"
  - "[ ] Error handling verified"
  - "[ ] Unit test completed"
 
# When a file under 'start/routes/' is changed:
start/routes/**:
  - "[ ] Route definitions reviewed"
  - "[ ] Auth and permissions checked"
  - "[ ] Request/response schema validated"
  - "[ ] Unit test completed"
 
#Keywords
"CREATE INDEX":
  - "[ ] Index created concurrently to avoid locking production table"
 
"console.log":
  - "[ ] Remove debug logs before merging"
 
"Event.emit":
  - "[ ] Event logic reviewed"
  - "[ ] Confirm that event.emit() is not awaited"
  - "[ ] Listener/handler tested"
  - "[ ] Error handling verified"
  - "[ ] Unit test completed"