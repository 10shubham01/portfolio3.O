name: Dynamic PR Checklist
 
on:
  pull_request:
    types: [opened, synchronize, edited] # Triggers when PR is opened, updated, or edited
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Required to compare against previous commits
 
      - name: Dynamic checklist generator
        uses: vishalsinha21/dynamic-checklist@v1
        with:
          # Path to your checklist definition file
          mappingFile: 'pr-checklist.json'
          
        env: 
          GITHUB_TOKEN: ${{ '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' }}