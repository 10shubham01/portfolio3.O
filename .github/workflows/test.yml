name: Dynamic PR Checklist

on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Dynamic checklist generator
        id: checklist
        uses: vishalsinha21/dynamic-checklist@v1
        with:
          mappingFile: 'pr-checklist.json'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if checklist is not complete
        run: |
          if [ "${{ steps.checklist.outputs.completed }}" != "true" ]; then
            echo "❌ Checklist incomplete! Please check all items before merging."
            exit 1
          fi
